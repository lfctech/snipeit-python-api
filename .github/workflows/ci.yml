name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, pydantic${{ matrix.pydantic-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        pydantic-version: ["~=2.0.0", "~=2.10.0"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install deps
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Pin pydantic version
        run: uv pip install "pydantic${{ matrix.pydantic-version }}"

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run pyright

      - name: Fast tests
        run: uv run pytest tests/unit tests/contract -q -m unit

      - name: Source branch coverage
        if: matrix.python-version == '3.13' && matrix.pydantic-version == '~=2.10.0'
        run: |
          uv run coverage run --branch --source=snipeit -m pytest tests/unit tests/contract -q -m unit
          uv run coverage report -m --fail-under=95

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install deps
        run: uv sync --all-extras --python 3.13

      - name: Start Snipe-IT stack
        run: make docker-up

      - name: Wait for API readiness
        run: ./docker/wait-for-snipeit.sh

      - name: Integration tests
        run: uv run pytest tests/integration -q -m integration
